<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#12161c">
  <title>德州扑克</title>
  <link rel="stylesheet" href="/style.css">
</head>
<body>

  <!-- ============ 大厅 ============ -->
  <section id="lobby" class="screen">
    <div class="lobby-card">
      <h1><span class="suit-b">♠</span><span class="suit-r">♥</span> 德州扑克</h1>
      <p class="sub">局域网多人联机 · 可加入 AI 对手</p>

      <label>
        <span>你的昵称</span>
        <input id="nameInput" maxlength="12" placeholder="小明" autocomplete="off">
      </label>

      <label>
        <span>房间号 <em>（加入别人的房间）</em></span>
        <input id="roomInput" maxlength="4" inputmode="numeric" placeholder="例如 1234（创建时留空则自动生成）" autocomplete="off">
      </label>

      <div class="lobby-buttons">
        <button id="joinBtn" class="btn">加入房间</button>
        <button id="createBtn" class="btn primary">创建新房间</button>
      </div>

      <p id="lobbyMsg" class="msg"></p>
      <p class="tip">提示：同一 WiFi 下，让朋友打开同一网址即可联机。</p>
    </div>
  </section>

  <!-- ============ 牌桌 ============ -->
  <section id="table" class="screen hidden">
    <header class="topbar">
      <span class="room">房间 <b id="roomLabel">----</b></span>
      <span id="handLabel" class="hand">等待开始</span>
      <span id="hostTag" class="host-tag hidden">房主</span>
      <span class="spacer"></span>
      <button id="aiBtn" class="btn small">+ 机器人</button>
      <button id="pauseBtn" class="btn small hidden">⏸ 暂停</button>
      <button id="soundBtn" class="btn small" title="提示音开关">🔊</button>
      <button id="logBtn" class="btn small">记录</button>
      <button id="leaveBtn" class="btn small danger">离开</button>
    </header>

    <main class="table-wrap">
      <div class="felt">
        <div class="center">
          <div class="pot">底池 <b id="potLabel">0</b></div>
          <div class="board" id="board"></div>
          <div class="phase" id="phaseLabel"></div>
        </div>
        <div id="seats" class="seats"></div>
      </div>
    </main>

    <footer class="bottom">
      <div class="mycards" id="mycards"></div>
      <div class="actions" id="actions"></div>
    </footer>

    <aside class="logbox hidden" id="logbox">
      <div class="loghead">
        <span>牌局记录</span>
        <button id="logClose" class="btn tiny">×</button>
      </div>
      <div class="log" id="log"></div>
    </aside>
  </section>

  <!-- 操作提示 -->
  <div id="actionFlash" class="action-flash hidden"></div>

  <!-- 摊牌结果 -->
  <div id="resultModal" class="modal hidden">
    <div class="modal-card">
      <h2>本手结束</h2>
      <div class="result-pot">底池 <b id="resultPot">0</b></div>
      <div id="resultBoard" class="result-board hidden"></div>
      <div id="resultMine" class="result-mine hidden"></div>
      <div id="resultList" class="result-list"></div>
      <div class="modal-foot">
        <span id="resultHint" class="result-hint"></span>
        <button id="nextHandBtn" class="btn primary hidden">开始下一手</button>
      </div>
    </div>
  </div>

  <!-- 被淘汰 -->
  <div id="bustModal" class="modal hidden">
    <div class="modal-card narrow">
      <h2>你已被淘汰</h2>
      <p class="bust-msg">筹码不足一个大盲，已被请出牌桌。</p>
      <div class="bust-actions">
        <button id="rejoinBtn" class="btn primary">重新入座（1 万筹码）</button>
        <button id="bustLeaveBtn" class="btn">离开房间</button>
      </div>
    </div>
  </div>

  <!-- 暂停遮罩 -->
  <div id="pauseOverlay" class="pause-overlay hidden">
    <div class="pause-card">
      <div class="pause-icon">⏸</div>
      <div class="pause-title">暂停中</div>
      <div class="pause-time" id="pauseTime">00:00</div>
      <div class="pause-sub" id="pauseSub">等待房主继续</div>
      <button id="resumeBtn" class="btn primary hidden">继续游戏</button>
    </div>
  </div>

  <div id="toast" class="toast hidden"></div>

  <script src="/app.js"></script>
</body>
</html>
